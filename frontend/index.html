<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- ── Primary Meta ── -->
    <title>BidArenaX — Live Cricket Tournament Auction Platform</title>
    <meta name="description"
      content="IPL-style live cricket auction platform. Create tournaments, register players, conduct live auctions with real-time bidding, purse tracking and team management." />
    <meta name="keywords"
      content="cricket auction, IPL auction system, live cricket bidding, player auction, cricket tournament management, cricket team auction" />
    <meta name="author"    content="BidArenaX" />
    <meta name="theme-color" content="#f59e0b" />

    <!-- ── Open Graph ── -->
    <meta property="og:type"        content="website" />
    <meta property="og:title"       content="BidArenaX — Live Cricket Tournament Auction Platform" />
    <meta property="og:description" content="IPL-style live cricket auction platform. Real-time bidding, team management and player auctions." />
    <meta property="og:image"       content="/og-default.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:locale"      content="en_IN" />

    <!-- ── Twitter Card ── -->
    <meta name="twitter:card"        content="summary_large_image" />
    <meta name="twitter:title"       content="BidArenaX — Live Cricket Auction Platform" />
    <meta name="twitter:description" content="IPL-style live cricket auction platform. Real-time bidding and team management." />
    <meta name="twitter:image"       content="/og-default.png" />

    <!-- ── Favicon ── -->
    <link rel="icon" type="image/png" href="/logo2.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest"         href="/site.webmanifest" />

    <!-- ── Preload the landing page's hero image (LCP element) so the
         browser starts fetching it immediately during HTML parsing
         instead of discovering it late via the CSS background-image. ── -->
    <link rel="preload" as="image"
      href="https://images.unsplash.com/photo-1531415077968-de08abad10ab?auto=format&fit=crop&w=1600&q=70" />

    <!-- ── Performance: preconnect to external resources ── -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://cdnjs.cloudflare.com" crossorigin />

    <!-- ── Fonts + Font Awesome: loaded non-render-blocking.
         The stylesheet is fetched with low priority (media="print"),
         then swapped to "all" once loaded, so first paint isn't held up
         waiting on these — text renders immediately in a fallback font
         (display=swap on the Google Fonts URL) and icons pop in shortly
         after instead of blocking the whole page. ── -->
    <link rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Inter:wght@300;400;500;600;700&family=Playfair+Display:wght@600;700;800;900&family=JetBrains+Mono:wght@500;600;700&display=swap"
      media="print" onload="this.media='all'" />
    <link rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
      integrity="sha512-SnH5WK+bZxgPHs44uWIX+LLJAJ9/2PkPKZ5QiAj6Ta86w+fsb2TkcmfRyVX3pBnMFcV7oQPJkl9QevSCWr3W6A=="
      crossorigin="anonymous" referrerpolicy="no-referrer"
      media="print" onload="this.media='all'" />
    <noscript>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Inter:wght@300;400;500;600;700&family=Playfair+Display:wght@600;700;800;900&family=JetBrains+Mono:wght@500;600;700&display=swap" />
      <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
    </noscript>

    <!-- Theme is fixed to light app-wide; Landing page uses its own explicit dark hero styling. -->
    <script>
      try { localStorage.removeItem('theme'); document.documentElement.classList.remove('dark'); } catch(e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
